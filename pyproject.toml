[project]
name = "jobpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamedasif99", email = "mohamedasif98430@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.63.0",
    "pyautogui>=0.9.54",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
jobpilot = "jobpilot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
